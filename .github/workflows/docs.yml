# This workflow builds and validates documentation when code is merged into main
# ReadTheDocs will automatically rebuild hosted docs via webhook integration

name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Check for build warnings
        run: |
          cd docs
          if [ -f build/html/.buildinfo ]; then
            echo "Documentation built successfully!"
          else
            echo "Documentation build failed!"
            exit 1
          fi
